# Prina OSS installation compose.
# Differences from the commercial kit: public image, no license, no auto-updater.
# Manual update: change PRINA_VERSION in .env → docker compose pull && docker compose up -d
services:
  postgres:
    # bundled with pgvector (semantic search — falls back to FTS without it, but bundled by default)
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-prina}
    volumes:
      # PG18-family images mount at /var/lib/postgresql (not the data subdir — an 18.x change)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # To use your own S3, remove minio & minio-init and set the S3_* variables
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # One-shot bucket creation on first boot (core does not auto-create buckets).
  # `mc alias set` verifies server connectivity, so the retry loop doubles as startup wait.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_USER" "$$MINIO_PASSWORD"; do
          echo "waiting for minio..."; sleep 2
        done
        mc mb -p "local/$$BUCKET"
    environment:
      MINIO_USER: ${S3_ACCESS_KEY:?}
      MINIO_PASSWORD: ${S3_SECRET_KEY:?}
      BUCKET: ${S3_BUCKET:-prina-assets}
    restart: "no"

  imgproxy:
    image: darthsim/imgproxy:v3.27
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      IMGPROXY_KEY: ${IMGPROXY_KEY:?}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?}
    restart: unless-stopped

  core:
    image: ${PRINA_REGISTRY:-ghcr.io/humanetools}/prina:${PRINA_VERSION:?}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prina}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-prina-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      IMGPROXY_URL: http://imgproxy:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PRINA_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # no curl/wget in the image — health check via node's built-in fetch
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
